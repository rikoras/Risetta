name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          if [ -f risetta-macos/build.sh ]; then
            cd risetta-macos
          fi
          bash build.sh --no-open

      - name: Package
        run: |
          if [ -d risetta-macos/build/Risetta.app ]; then
            APP="risetta-macos/build/Risetta.app"
          else
            APP="build/Risetta.app"
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Risetta-macos-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Risetta-macos-app
          path: dist/Risetta-macos-app.zip
